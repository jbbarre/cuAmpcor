[build-system]
requires = ["scikit-build-core"]
build-backend = "scikit_build_core.build"

[project]
name = "pycuampcor"
version = "2.0"
description = "Amplitude Cross-Correlation with CUDA"
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.6"

[project.scripts]
cuDenseOffsets = "pycuampcor.examples.cuDenseOffsets:main"
plotOffsets = "pycuampcor.examples.plotOffsets:main"
grossOffsets = "pycuampcor.examples.grossOffsets:main"
GeoTiffSample = "pycuampcor.examples.GeoTiffSample:main"
glacierSample = "pycuampcor.examples.glacierSample:main"
varyGrossOffsetSample = "pycuampcor.examples.varyGrossOffsetSample:main"
toLegacyAmpcor = "pycuampcor.examples.toLegacyAmpcor:main"

[tool.scikit-build]
# optional: set CMake options
cmake.version = ">=3.15"
sdist.include = ["src"]
wheel.packages = ["pycuampcor"]

[tool.scikit-build.cmake.define]
CMAKE_BUILD_TYPE = "Release"
